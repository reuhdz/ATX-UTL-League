<body class="stats-admin-page">
<header class="app-header">
  <div class="brand">
    <span class="brand-mark">🌊</span>
    <div>
      <h1 class="brand-title">ATX <span>UTL</span></h1>
      <p class="brand-sub">Match stats (captains / admin)</p>
    </div>
  </div>
</header>

<main id="stats-app" class="view"></main>

<div id="stat-criteria-modal" class="modal-overlay" hidden>
  <div class="modal-card se-criteria-card" role="dialog" aria-modal="true" aria-labelledby="stat-criteria-title">
    <div class="modal-head">
      <h2 id="stat-criteria-title">Box score criteria</h2>
      <button type="button" class="btn btn-ghost" id="stat-criteria-close">Close</button>
    </div>
    <p class="muted small">How to credit each column on the player box score.</p>
    <div id="stat-criteria-body"></div>
  </div>
</div>
